<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Colore della barra del browser e di sistema: quello della testata, carta rosa nel tema chiaro e inchiostro nello scuro -->
    <meta name="theme-color" content="#f4dcd3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1b1716" media="(prefers-color-scheme: dark)" />
    <!-- Campi, barre di scorrimento e fondo del browser seguono il tema del sistema, come le pagine -->
    <meta name="color-scheme" content="light dark" />
    <!-- Tema scelto nel profilo (lib/theme.ts) prima del primo disegno, così non si vede l'altro; senza scelta il
         tema del sistema. Il resto (controlli del browser, barra di sistema) lo fa l'app all'avvio -->
    <script>
      try {
        var tema = localStorage.getItem('nbbgm:tema');
        if (tema === 'chiaro' || tema === 'scuro') document.documentElement.setAttribute('data-tema', tema);
      } catch (e) {}
    </script>
    <meta name="description" content="Il manageriale di basket a turni da giocare con gli amici." />
    <!-- PWA: installabile dalla home del telefono -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="NBBGM" />
    <!-- Segno della pagina dell'app: il service worker salva per l'uso senza rete solo questa pagina -->
    <meta name="application-name" content="NBBGM" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>NBBGM</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
