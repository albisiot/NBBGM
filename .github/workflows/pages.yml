# Pubblica l'app su GitHub Pages dopo che i Controlli (ci.yml) sono passati su un push a main (o a mano, da
# Actions), con lo stesso commit che i Controlli hanno provato. URL e chiave publishable di Supabase sono fatti
# per stare nel browser: arrivano dalle variabili del repository (Settings > Secrets and variables > Actions >
# Variables): SUPABASE_URL e SUPABASE_PUBLISHABLE_KEY. VAPID_PUBLIC_KEY (facoltativa) è la chiave pubblica delle
# notifiche push: senza, l'app non le propone.
name: GitHub Pages

on:
  workflow_run:
    workflows: [Controlli]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Solo dopo Controlli riusciti su un push a main di questo repository (non una pull request da un fork)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build dell'app
        run: pnpm --filter @nbbgm/web build
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
