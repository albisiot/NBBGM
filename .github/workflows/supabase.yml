# Pubblica migrazioni ed Edge Functions su Supabase dopo che i Controlli (ci.yml) sono passati su un push a main
# (o a mano, da Actions). Si pubblica lo stesso commit che i Controlli hanno provato. Migrazioni già applicate e
# funzioni uguali non cambiano nulla, quindi si pubblica a ogni push: niente filtro sui file cambiati, che con
# workflow_run non c'è. Serve il segreto del repository SUPABASE_ACCESS_TOKEN (token personale di Supabase) e la
# variabile SUPABASE_PROJECT_REF: con --remote=<progetto> la CLI usa i permessi del token, senza password del
# database. Senza il segreto il job avvisa e non pubblica nulla.
name: Supabase

on:
  workflow_run:
    workflows: [Controlli]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: supabase
  cancel-in-progress: false

jobs:
  deploy:
    # Solo dopo Controlli riusciti su un push a main di questo repository (non una pull request da un fork)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Controlla segreto e variabile
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then
            echo "::warning::Mancano il segreto SUPABASE_ACCESS_TOKEN o la variabile SUPABASE_PROJECT_REF: non pubblico nulla"
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi
      - name: Migrazioni
        if: env.SKIP != '1'
        run: npx --yes supabase@3.0.0 db push --remote="$PROJECT_REF" --yes
      - name: Edge Functions
        if: env.SKIP != '1'
        run: >-
          npx --yes supabase@3.0.0 functions deploy create-league draft advance-turn market push
          --remote="$PROJECT_REF" --use-api --yes
