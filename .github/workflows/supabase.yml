# Pubblica migrazioni ed Edge Functions su Supabase dopo che i Controlli (ci.yml) sono passati su un push a main
# (o a mano, da Actions, solo dal ramo main). Si pubblica lo stesso commit che i Controlli hanno provato, e solo se
# è ancora la punta di main: rilanciare un vecchio controllo, o due push i cui controlli finiscono in ordine
# inverso, non riporta in produzione funzioni più vecchie (il run lo dice nel log e salta). Migrazioni già
# applicate e funzioni uguali non cambiano nulla, quindi si pubblica a ogni push: niente filtro sui file cambiati,
# che con workflow_run non c'è. Serve il segreto SUPABASE_ACCESS_TOKEN (token personale di Supabase) e la
# variabile SUPABASE_PROJECT_REF: con --remote=<progetto> la CLI usa i permessi del token, senza password del
# database. Senza il segreto il job avvisa e non pubblica nulla. Il job usa l'environment "supabase": su GitHub
# (Settings > Environments) gli si possono limitare i rami a main e spostare lì il segreto, così nessun altro
# workflow lo legge (vedi supabase/README.md).
name: Supabase

on:
  workflow_run:
    workflows: [Controlli]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: supabase
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # Solo dopo Controlli riusciti su un push a main di questo repository (non una pull request da un fork), o a
    # mano dal ramo main
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    environment:
      name: supabase
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Solo la punta di main
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          TIP="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ -z "$TIP" ]; then
            echo "::error::Non riesco a leggere la punta di main"
            exit 1
          fi
          if [ "$TIP" != "$SHA" ]; then
            echo "::notice::Il commit $SHA non è più la punta di main ($TIP): non pubblico, ci pensa il run del commit più recente"
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-node@v7
        if: env.SKIP != '1'
        with:
          node-version: 24
      - name: Controlla segreto e variabile
        if: env.SKIP != '1'
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then
            echo "::warning::Mancano il segreto SUPABASE_ACCESS_TOKEN o la variabile SUPABASE_PROJECT_REF: non pubblico nulla"
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi
      - name: Migrazioni
        if: env.SKIP != '1'
        run: npx --yes supabase@3.0.0 db push --remote="$PROJECT_REF" --yes
      - name: Edge Functions
        if: env.SKIP != '1'
        run: >-
          npx --yes supabase@3.0.0 functions deploy create-league draft advance-turn market push
          --remote="$PROJECT_REF" --use-api --yes
