# Pubblica migrazioni ed Edge Functions su Supabase quando cambiano su main (o a mano). Servono i segreti del
# repository SUPABASE_ACCESS_TOKEN (token personale della CLI) e SUPABASE_DB_PASSWORD (password del database), e
# la variabile SUPABASE_PROJECT_REF. Senza, il job non pubblica nulla.
name: Supabase

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'packages/engine/src/**'
  workflow_dispatch:

concurrency:
  group: supabase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Controlla segreti e variabili
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$PROJECT_REF" ]; then
            echo "::warning::Mancano SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD o SUPABASE_PROJECT_REF: non pubblico nulla"
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi
      - name: Collega il progetto
        if: env.SKIP != '1'
        run: npx --yes supabase@3.0.0 link --project-ref "$PROJECT_REF"
      - name: Migrazioni
        if: env.SKIP != '1'
        run: npx --yes supabase@3.0.0 db push --remote --yes
      - name: Edge Functions
        if: env.SKIP != '1'
        run: npx --yes supabase@3.0.0 functions deploy create-league draft advance-turn market --use-api --yes
