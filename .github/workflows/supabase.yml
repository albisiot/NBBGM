# Pubblica migrazioni ed Edge Functions su Supabase quando cambiano su main (o a mano, da Actions). Serve il
# segreto del repository SUPABASE_ACCESS_TOKEN (token personale di Supabase) e la variabile SUPABASE_PROJECT_REF:
# con --remote=<progetto> la CLI usa i permessi del token, senza password del database. Senza il segreto il job
# avvisa e non pubblica nulla.
name: Supabase

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'packages/engine/src/**'
  workflow_dispatch:

concurrency:
  group: supabase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Controlla segreto e variabile
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then
            echo "::warning::Mancano il segreto SUPABASE_ACCESS_TOKEN o la variabile SUPABASE_PROJECT_REF: non pubblico nulla"
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi
      - name: Migrazioni
        if: env.SKIP != '1'
        run: npx --yes supabase@3.0.0 db push --remote="$PROJECT_REF" --yes
      - name: Edge Functions
        if: env.SKIP != '1'
        run: >-
          npx --yes supabase@3.0.0 functions deploy create-league draft advance-turn market
          --remote="$PROJECT_REF" --use-api --yes
